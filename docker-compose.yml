services:
  api-service:
    image: swift-deploy-1-node:latest
    # Security: Run as non-root and drop all kernel capabilities
    user: "1000:1000"
    cap_drop:
      - ALL
    environment:
      - MODE=canary
      - APP_VERSION=1.0.0
      - APP_PORT=3000
    networks:
      - swiftdeploy-net
    volumes:
      - app_logs:/home/swiftuser/app/logs
    deploy:
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:latest
    # Security: Run as the default non-root nginx user (UID 101)
    user: "101:101"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # Required for binding ports < 1024
    ports:
      - "8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    # Use tmpfs for volatile paths to ensure non-root write access without host mounts
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - swiftdeploy-net
    depends_on:
      api-service:
        condition: service_healthy

networks:
  swiftdeploy-net:
    driver: bridge

volumes:
  app_logs:
  nginx_logs: