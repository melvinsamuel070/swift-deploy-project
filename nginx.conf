# Move PID to a writable directory for non-root user
pid /tmp/nginx.pid;

events { 
    worker_connections 1024; 
}

http {
    # Use /tmp for temp files (non-root safe)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Required log format
    log_format swift_format '$time_iso8601 | $status | ${request_time}s | $upstream_addr | $request';

    access_log /var/log/nginx/access.log swift_format;

    # 🔥 IMPORTANT: backend host should be templated for validate vs deploy
    upstream backend_servers {
        server api-service:3000;
    }

    server {
        listen 8081;

        # Required header
        add_header X-Deployed-By swiftdeploy;

        # Timeouts (safe with units)
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;

        location / {
            proxy_pass http://backend_servers;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Forward upstream header
            proxy_pass_header X-Mode;

            # Enable JSON error handling
            proxy_intercept_errors on;
        }

        location /healthz {
            proxy_pass http://backend_servers/healthz;
        }

        # JSON error responses (required)
        error_page 502 503 504 /error_json;

        location = /error_json {
            internal;
            default_type application/json;
            return 502 '{"error":"Service Unavailable","code":502,"service":"api-service","contact":"devops-team"}';
        }
    }
}